# ============================================================
# Hand Tracking CPU - Resource Configuration
# ============================================================
# This file defines all resource paths needed by the hand_tracking pipeline.
# Place it next to the executable or in the working directory.
# Command-line flags can override these values at runtime.

[paths]
# Resource root directory - all model/graph paths are relative to this
resource_root_dir = resource

# Calculator graph configuration file
# If relative, resolved first as-is then via resource_root_dir
graph_config = graphs/hand_tracking_desktop_live.pbtxt

[video]
# Input video file path (leave empty to use webcam)
# Use absolute path for reliability, or relative to working directory
input =

# Output video file path (leave empty to show in window)
output =

[models]
# Palm detection model (full, 192x192 input)
palm_detection = mediapipe/modules/palm_detection/palm_detection_full.tflite

# Hand landmark model (full, 21 landmarks)
hand_landmark = mediapipe/modules/hand_landmark/hand_landmark_full.tflite

[detection]
# Maximum number of hands to track (1-4)
num_hands = 2

# Model complexity: 0 = Lite (faster, less accurate), 1 = Full (slower, more accurate)
model_complexity = 1

[execution]
# Number of threads for TFLite inference (0 = auto-detect)
num_threads = 2

# Enable XNNPACK delegate (true/false)
xnnpack_enable = true
